<body>
  <main>
    <header>
      <div class="identity"><h1>随剪</h1><span class="project">口播拆条合作</span></div>
      <div class="header-meta"><span>小红书</span><span class="source">原 brief ↗</span></div>
    </header>
    <section class="row">
      <div class="label"><span class="number">01</span><h2>这个产品到底是干嘛的？</h2></div>
      <div class="answer"><p>把一段长口播，拆成几条能单独发布的短视频。</p><span class="expand" aria-hidden="true">+</span></div>
    </section>
    <section class="row">
      <div class="label"><span class="number">02</span><h2>对方想让我推哪个功能？</h2></div>
      <div class="answer"><p><strong>按主题拆条</strong></p><p class="quiet">重点演示怎么选片段，字幕只做辅助。</p><span class="expand" aria-hidden="true">+</span></div>
    </section>
    <section class="row requirements">
      <div class="label"><span class="number">03</span><h2>对方的要求和限制？</h2></div>
      <div class="answer">
        <p class="format">真人出镜 · 60–90 秒竖屏</p>
        <dl class="facts"><dt>必拍</dt><dd>导入素材 → 推荐片段 → 人工校对字幕 → 导出成片</dd><dt>禁区</dt><dd>不露竞品，不承诺零错误，不编造效率数据。</dd></dl>
        <p class="schedule">10.28 18:00 交脚本 · 10.30 发布</p><span class="expand" aria-hidden="true">+</span>
      </div>
    </section>
    <section class="row video">
      <div class="label"><span class="number">04</span><h2>我可以怎么做这条视频？<span class="suggestion">建议</span></h2></div>
      <div class="answer"><p>从“长口播里找一条能发的”切入。</p><p class="quiet">用自己的素材走完拆条，最后展示成片。</p><div class="reference"><span class="reference-name">参考视频 ↗</span><span class="ref-status">未查看</span></div><span class="expand" aria-hidden="true">+</span></div>
    </section>
  </main>
