<body>
<main class="page">
  <header class="brand-header" aria-label="fly-brief">
    <a class="brand-link" href="https://github.com/flyl1u/fly-brief" target="_blank" rel="noopener noreferrer"><img class="brand-icon" src="__FLY_BRIEF_ICON__" width="32" height="32" alt=""><span>fly-brief</span></a>
    <div class="brand-actions"><button class="source-entry" id="open-sources" type="button" hidden>原 brief ↗</button><a class="star-link" href="https://github.com/flyl1u/fly-brief" target="_blank" rel="noopener noreferrer"><span class="star-copy"><span>觉得还不错？</span><span>去点颗star</span></span><svg class="star-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.8 5.7 6.3.9-4.6 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L2.9 9.6l6.3-.9L12 3Z"/></svg></a></div>
  </header>
  <h1 class="sr-only" id="report-title"></h1>
  <div id="overview"></div>
  <noscript>请启用 JavaScript 查看这份本地报告。</noscript>
</main>
<dialog id="evidence-dialog" aria-label="来源摘录"><div class="dialog-header"><button class="close-dialog" id="close-dialog" type="button">关闭</button></div><div id="dialog-content"></div></dialog>
<script id="report-data" type="application/json">__FLY_BRIEF_DATA__</script>
<script>
(() => {
  'use strict';
  const data=JSON.parse(document.getElementById('report-data').textContent);
  const definitions=[['product','这个产品到底是干嘛的？'],['promotion','对方想让我推哪个功能？'],['requirements','对方的要求和限制？'],['video','我可以怎么做这条视频？']];
  const labels={suggestion:'建议',unknown:'待确认',conflict:'有冲突'};
  const sources=new Map(data.sources.map(source=>[source.id,source]));
  const dialog=document.getElementById('evidence-dialog');
  const dialogContent=document.getElementById('dialog-content');
  const disclosures=[];
  function el(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node;}
  function link(url,title,className){const node=el('a',className,title);if(['http:','https:','file:'].includes(new URL(url).protocol))node.href=url;node.target='_blank';node.rel='noopener noreferrer';return node;}
  function showEvidence(ids){
    dialogContent.replaceChildren();
    [...new Set(ids)].forEach(id=>{
      const source=sources.get(id);const entry=el('section','evidence');
      entry.append(el('h3','',source.title),el('p','location',source.location),el('blockquote','',source.excerpt));
      if(source.url)entry.append(link(source.url,'打开原始资料 ↗','original'));
      dialogContent.append(entry);
    });dialog.showModal();
  }
  function sourceButton(ids,context,label='原文',className='inline-source source-button'){
    if(!ids?.length)return null;
    const button=el('button',className,label);button.type='button';button.setAttribute('aria-label',`查看原文：${context}`);button.addEventListener('click',()=>showEvidence(ids));return button;
  }
  function appendStatus(node,record,show=true){if(show&&labels[record.kind])node.append(el('span',`status ${record.kind}`,labels[record.kind]));}
  function content(record,tag,className='',withSource=false,withStatus=true){
    const node=el(tag,className);appendStatus(node,record,withStatus);
    if(record.steps?.length){const steps=el('ol','case-steps');record.steps.forEach(text=>steps.append(el('li','',text)));node.append(steps,el('span','subnote',record.text));}
    else node.append(document.createTextNode(record.text));
    const source=withSource&&sourceButton(record.source_ids,record.text);if(source)node.append(source);return node;
  }
  function sourceIds(section){return [...new Set([
    ...(section.summary.source_ids||[]),...(section.note?.source_ids||[]),
    ...(section.highlights||[]).flatMap(item=>item.source_ids||[]),...(section.schedule||[]).flatMap(item=>item.source_ids||[]),
    ...(section.details||[]).flatMap(branch=>[...branch.items,...Object.values(branch.preview||{})].flatMap(item=>item.source_ids||[])),
    ...(section.references||[]).flatMap(item=>item.source_ids||[])
  ])];}
  function disclosure(id,context,closed,className){
    const details=el('details',className);details.id=id;
    const toggle=el('summary',className==='topic'?'topic-summary':'disclosure-toggle');
    const action=el('span',className==='topic'?'topic-action':'toggle-action');
    const icon=el('i','expand-icon');icon.setAttribute('aria-hidden','true');
    action.append(el('span','closed-label',closed),el('span','open-label',className==='topic'?'收起':'收起详情'),icon);
    toggle.append(action);details.append(toggle);
    function update(){toggle.setAttribute('aria-label',`${details.open?'收起':'展开'}：${context}`);toggle.setAttribute('aria-expanded',String(details.open));}
    details.addEventListener('toggle',update);update();disclosures.push(details);return {details,toggle,action};
  }
  function renderBranch(branch,section){
    const group=el('section','branch');const isFields=branch.items.every(item=>item.label);
    group.append(el('h3',isFields?'sr-only':'',branch.title));
    const list=el(isFields?'dl':'ul',isFields?'field-list':'');
    branch.items.forEach(item=>{
      const stated=(item.kind==='unknown'&&/确认|待定/u.test(branch.title))||(item.kind==='conflict'&&/冲突/u.test(branch.title));
      const showStatus=item.kind!==section.summary.kind&&!stated;
      if(isFields){const field=el('div','field');field.append(el('dt','',item.label),content(item,'dd','',true,showStatus));list.append(field);}
      else list.append(content(item,'li','',true,showStatus));
    });group.append(list);return group;
  }
  function appendHighlights(answer,items){
    if(!items?.length)return;
    const list=el('dl','obligations');
    items.forEach(record=>{
      const item=el('div','obligation');item.append(el('dt','',record.label||''));
      const text=content(record,'dd',record.label==='必拍'?'must-show':'');
      if(record.text.includes('→')){text.replaceChildren();appendStatus(text,record);record.text.split(/\s*→\s*/u).forEach((step,index)=>{if(index)text.append(document.createTextNode(' → '));text.append(el('span','flow-step',step));});}
      item.append(text);list.append(item);
    });answer.append(list);
  }
  function appendSchedule(answer,items){
    if(!items?.length)return;
    const schedule=el('div','schedule');schedule.setAttribute('aria-label','交付时间');
    items.forEach(record=>{const entry=el('div','schedule-item');const value=content(record,record.datetime?'time':'span','date-value');if(record.datetime)value.dateTime=record.datetime;entry.append(el('span','schedule-label',record.label),value);schedule.append(entry);});answer.append(schedule);
  }
  function appendReferences(answer,section){
    if(!section.references?.length)return;
    const references=el('div','references');
    section.references.forEach(reference=>{
      const entry=el('div','reference');entry.append(link(reference.url,`${reference.title} ↗`,''));
      if(reference.status==='unavailable')entry.append(el('span','ref-status','无法访问'));
      references.append(entry);
      if(reference.status==='viewed'&&reference.note){const note=content({text:reference.note,kind:'suggestion',source_ids:reference.source_ids},'p','reference-note',true);references.append(note);}
    });answer.append(references);
  }
  document.getElementById('report-title').textContent=[data.title,data.subtitle].filter(Boolean).join(' · ');
  if(sources.size){const button=document.getElementById('open-sources');button.hidden=false;button.addEventListener('click',()=>showEvidence([...sources.keys()]));}
  definitions.forEach(([key,title],index)=>{
    const section=data.sections[key];const row=el('section','row');row.id=key;row.setAttribute('aria-labelledby',`heading-${key}`);
    const label=el('div','label');const number=el('span','number',String(index+1).padStart(2,'0'));number.setAttribute('aria-hidden','true');
    const labelText=el('div','label-text');const heading=el('h2','',title);heading.id=`heading-${key}`;labelText.append(heading);
    if(labels[section.summary.kind])labelText.append(el('span',`section-kind ${section.summary.kind}`,key==='video'&&section.summary.kind==='suggestion'?'创作建议':labels[section.summary.kind]));
    label.append(number,labelText);row.append(label);const answer=el('div','answer');
    if(key==='video'){
      const top=el('div','video-top');top.append(content(section.summary,'p','summary',false,false));
      if(section.details?.length)top.append(el('span','topic-count',`${section.details.length} 个选题`));answer.append(top);
      if(section.note)answer.append(content(section.note,'p','note',false,section.note.kind!==section.summary.kind));
      appendHighlights(answer,section.highlights);
      const hasPreviews=section.details?.some(branch=>branch.preview);
      if(hasPreviews){const head=el('div','topic-head');head.setAttribute('aria-hidden','true');['选题','要准备','做成什么',''].forEach(text=>head.append(el('span','',text)));answer.append(head);}
      (section.details||[]).forEach((branch,index)=>{
        const {details,toggle,action}=disclosure(`topic-${index+1}`,branch.title,'看拍法','topic');
        if(!branch.preview)toggle.classList.add('topic-simple');
        const name=el('span','topic-name',branch.title);const preview=branch.preview;
        if(preview){const role=content(preview.role,'span','topic-role',false,preview.role.kind!=='suggestion');name.append(role);}
        toggle.insertBefore(name,action);
        if(preview){[['materials','topic-material','准备'],['output','topic-output','产物']].forEach(([field,className,label])=>{const cell=el('span',className);cell.append(el('span','mobile-label',label),content(preview[field],'span','',false,preview[field].kind!=='suggestion'));toggle.insertBefore(cell,action);});}
        const body=el('div','topic-content');body.append(renderBranch(branch,section));
        const previewIds=Object.values(preview||{}).flatMap(item=>item.source_ids||[]);const citation=sourceButton(previewIds,branch.title,'选题依据','section-source source-button');if(citation)body.append(citation);
        details.append(body);answer.append(details);
      });
      appendReferences(answer,section);
      if(!section.details?.length&&sourceIds(section).length){const citation=sourceButton(sourceIds(section),title,'查看本节原文','section-source source-button');answer.append(citation);}
    }else{
      const top=el('div','answer-top');top.append(content(section.summary,'p',key==='promotion'?'summary promotion-title':'summary',false,false));
      if(section.note)top.append(content(section.note,'p','note',false,section.note.kind!==section.summary.kind));answer.append(top);
      appendSchedule(answer,section.schedule);appendHighlights(answer,section.highlights);
      const ids=sourceIds(section);
      if(section.details?.length||ids.length){
        row.classList.add('has-details');
        const actions={product:'展开详情',promotion:'看演示重点',requirements:'其他要求'};
        const {details}=disclosure(`details-${key}`,title,actions[key],'section-disclosure');
        const body=el('div','detail-body');(section.details||[]).forEach(branch=>body.append(renderBranch(branch,section)));
        const citation=sourceButton(ids,title,'查看本节原文','section-source source-button');if(citation)body.append(citation);
        details.append(body);answer.append(details);
      }else row.classList.add('standalone-answer');
    }
    row.append(answer);document.getElementById('overview').append(row);
  });
  if(new URLSearchParams(location.search).get('state')==='expanded')disclosures.forEach(details=>{details.open=true;});
  document.getElementById('close-dialog').addEventListener('click',()=>dialog.close());
  dialog.addEventListener('click',event=>{const r=dialog.getBoundingClientRect();if(event.target===dialog&&(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom))dialog.close();});
  window.addEventListener('beforeprint',()=>disclosures.forEach(details=>{details.dataset.wasOpen=String(details.open);details.open=true;}));
  window.addEventListener('afterprint',()=>disclosures.forEach(details=>{details.open=details.dataset.wasOpen==='true';}));
})();
</script>
</body>
</html>
