<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src data:; img-src data:; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light">
  <title>__FLY_BRIEF_TITLE__</title>
  <style>
    __FLY_BRIEF_FONTS__
    :root{--paper:#fff;--ink:#1d1d1f;--secondary:#646466;--line:#e6e6e6;--focus:#333;--warning:#80500e;--conflict:#923b34;--body-font:"Fly Sans","Microsoft YaHei","PingFang SC",sans-serif;--title-font:"Fly Serif","SimSun",serif;color-scheme:light}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body-font);font-size:16px;line-height:1.8}button,a,summary{-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit;cursor:pointer;transition:background .15s,transform .15s}button:active,summary:active{transform:scale(.97)}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--focus);outline-offset:4px;border-radius:2px}a{color:inherit;text-underline-offset:5px;overflow-wrap:anywhere}[hidden]{display:none!important}
    .page{max-width:1056px;width:calc(100% - 112px);margin:0 auto;padding:58px 0 60px}.page-header{display:flex;justify-content:space-between;align-items:center;gap:24px;padding-bottom:30px;border-bottom:1px solid #242426}.identity{display:flex;align-items:baseline;gap:17px;min-width:0;flex-wrap:wrap}h1{font-family:var(--title-font);font-size:34px;font-weight:700;line-height:1.5;letter-spacing:-1px;margin:0;overflow-wrap:anywhere}.subtitle{font-size:16px;color:var(--secondary);overflow-wrap:anywhere}.demo-label{font-size:13px;color:var(--secondary)}.header-meta{display:flex;align-items:center;justify-content:flex-end;gap:26px;font-size:13px;color:var(--secondary);flex-wrap:wrap;flex-shrink:0;max-width:40%}.context{margin:0;overflow-wrap:anywhere}.source-entry{border:0;background:transparent;padding:4px 0;min-height:32px;white-space:nowrap;font-size:13px;color:#343437}.source-entry:hover{text-decoration:underline;text-underline-offset:5px}
    .row{position:relative;display:grid;grid-template-columns:273px minmax(0,1fr);gap:24px;padding:32px 0 30px;border-bottom:1px solid var(--line);scroll-margin-top:24px}.row:last-child{border-bottom:0}.label{display:flex;align-items:baseline;gap:15px;padding-top:4px;min-width:0}.number{font:13px/1.8 Consolas,monospace;color:#656569}.label-text{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}h2{font-size:15px;font-weight:500;line-height:1.65;margin:0}.section-tag{font-size:13px;line-height:1.5;color:#656569;border:1px solid #dedee0;border-radius:3px;padding:0 4px;white-space:nowrap}.section-tag.unknown,.status.unknown{color:var(--warning)}.section-tag.conflict,.status.conflict{color:var(--conflict)}.answer{position:relative;padding-right:38px;min-width:0}.summary{font-size:20px;line-height:1.85;letter-spacing:.1px;margin:0;overflow-wrap:anywhere}#promotion .summary{font-weight:600}.note{font-size:15px;line-height:1.8;color:var(--secondary);margin:7px 0 0;overflow-wrap:anywhere}.status{font-size:13px;margin-right:7px;white-space:nowrap}.highlights{display:grid;gap:6px;margin:12px 0 0;padding:0;list-style:none}.highlights li{display:flex;gap:13px;align-items:baseline;font-size:14px;line-height:1.9;overflow-wrap:anywhere}.highlight-label{flex:0 0 36px;color:#656569;white-space:nowrap}.highlight-text{min-width:0}.flow-step,.no-break{white-space:nowrap}.highlights .schedule{font-family:Consolas,var(--body-font);font-size:13px;color:var(--secondary)}#requirements .summary{font-size:18px}
    .references{margin-top:15px;display:grid;gap:10px}.reference{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;font-size:13px;line-height:1.8}.reference a{text-decoration:none;border-bottom:1px solid #bbbbbf;padding-bottom:1px}.reference a:hover{border-color:var(--ink)}.ref-status{font-size:13px;color:#656569}.disclosure-toggle{position:absolute;right:-10px;top:0;width:36px;height:36px;display:grid;place-items:center;list-style:none;cursor:pointer;color:#656569;border-radius:3px;transition:background .15s,transform .15s}.disclosure-toggle::-webkit-details-marker{display:none}.disclosure-toggle:hover{background:#f4f4f3}.expand-icon{position:relative;display:block;width:14px;height:14px}.expand-icon::before,.expand-icon::after{content:"";position:absolute;background:currentColor;left:0;top:6px;width:14px;height:1px}.expand-icon::after{transform:rotate(90deg);transition:transform .18s}details[open] .expand-icon::after{transform:rotate(0)}.detail-body{border-top:1px solid var(--line);margin-top:24px;padding-top:20px}.branch{margin-top:23px}.branch:first-child{margin-top:0}.branch h3{font-size:14px;line-height:1.7;font-weight:600;margin:0 0 7px}.branch ul{list-style:none;margin:0;padding:0}.branch li{font-size:15px;line-height:1.9;margin:7px 0 0;overflow-wrap:anywhere}.branch .status{color:var(--secondary)}.branch .status.unknown{color:var(--warning)}.branch .status.conflict{color:var(--conflict)}.source-button{display:inline-block;border:0;text-decoration:underline dotted #a5a5a8;text-underline-offset:3px;text-align:left;background:transparent;font-size:13px;line-height:1.5;color:var(--secondary);padding:0 2px;min-width:24px;min-height:24px;vertical-align:1px;margin-left:6px}.source-button:hover{color:var(--ink);background:#f4f4f3}.section-evidence{font-size:13px;color:var(--secondary);margin:19px 0 0}.section-evidence button{font-size:13px;padding:2px 0;min-height:30px;min-width:auto;margin:0}.text-tail{white-space:nowrap}
    dialog{background:var(--paper);color:var(--ink);border:1px solid #ddd;border-radius:6px;max-width:680px;width:calc(100% - 40px);max-height:84dvh;padding:26px 30px;box-shadow:0 20px 90px #0002}dialog[open]{animation:dialog-enter .18s ease-out}dialog::backdrop{background:#20202355}.dialog-header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}.dialog-header h2{font-size:20px;font-weight:600}.close-dialog{border:0;background:transparent;font-size:14px;min-height:36px;padding:4px 8px;color:var(--secondary)}.close-dialog:hover{background:#f4f4f3}.evidence+.evidence{border-top:1px solid var(--line);padding-top:21px;margin-top:24px}.evidence h3{font-size:15px;font-weight:600;margin:0}.location{font-size:13px;color:var(--secondary);margin:3px 0 12px}.evidence blockquote{font-size:15px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 12px}.original{font-size:13px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
    @keyframes dialog-enter{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:1000px) and (min-width:761px){.row{grid-template-columns:225px minmax(0,1fr);gap:20px}.summary{font-size:19px}.label{gap:12px}h2{font-size:14px}.identity{gap:12px}.header-meta{gap:16px}}
    @media(max-width:760px){.page{width:auto;margin:0 24px;padding:25px 0 36px}.page-header{align-items:flex-start;gap:14px;padding-bottom:20px}.identity{gap:4px 10px;flex:1}.identity h1{font-size:28px;line-height:1.5}.subtitle{font-size:14px}.header-meta{font-size:13px;gap:1px;align-items:flex-end;flex-direction:column;max-width:42%}.source-entry{min-height:44px}.row{grid-template-columns:minmax(0,1fr);gap:13px;padding:24px 0}.label{padding:0 44px 0 0;gap:12px}.label h2{font-size:15px}.label-text{gap:7px}.answer{position:static;padding:0}.summary{font-size:18px;line-height:1.85;text-wrap:balance}.note{font-size:15px}.highlights{gap:8px;margin-top:12px}.highlights li{font-size:14px;gap:10px}.highlight-label{flex-basis:32px}.disclosure-toggle{width:44px;height:44px;top:14px;right:-9px}.references{margin-top:14px}.reference a{padding:9px 0;min-height:44px}.ref-status{font-size:13px}.detail-body{margin-top:20px;padding-top:18px}.branch li{font-size:15px}.source-button{min-width:44px;min-height:44px}.section-evidence button{min-height:44px}dialog{padding:20px;max-height:85dvh}.close-dialog{min-width:44px;min-height:44px}.dialog-header{margin-bottom:16px}.evidence blockquote{font-size:15px}.original{display:inline-block;min-height:44px;padding:8px 0}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
    @media print{.page{width:auto;padding:0;margin:0}body{font-size:12pt}.row{break-inside:avoid}.source-entry,.disclosure-toggle,.source-button,dialog{display:none!important}.summary{font-size:14pt}.page-header{padding-bottom:15px}.detail-body{border-top:0}}
  </style>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <div class="identity"><h1 id="report-title"></h1><span class="subtitle" id="subtitle" hidden></span><span class="demo-label" id="demo-label" hidden>演示</span></div>
      <div class="header-meta"><p class="context" id="context" hidden></p><button class="source-entry" id="open-sources" type="button" hidden>原 brief ↗</button></div>
    </header>
    <div id="overview"></div>
    <noscript>请启用 JavaScript 查看这份本地报告。</noscript>
  </main>
  <dialog id="evidence-dialog" aria-labelledby="dialog-title">
    <div class="dialog-header"><h2 id="dialog-title">原文</h2><button class="close-dialog" id="close-dialog" type="button">关闭</button></div>
    <div id="dialog-content"></div>
  </dialog>
  <script id="report-data" type="application/json">__FLY_BRIEF_DATA__</script>
  <script>
    (() => {
      'use strict';
      const data = JSON.parse(document.getElementById('report-data').textContent);
      const definitions = [['product','这个产品到底是干嘛的？'],['promotion','对方想让我推哪个功能？'],['requirements','对方的要求和限制？'],['video','我可以怎么做这条视频？']];
      const labels = {suggestion:'建议',unknown:'待确认',conflict:'有冲突'};
      const statuses = {viewed:'',unviewed:'未查看',unavailable:'无法访问'};
      const sources = new Map(data.sources.map(source => [source.id,source]));
      const sourceNumbers = new Map(data.sources.map((source,index) => [source.id,index+1]));
      const dialog = document.getElementById('evidence-dialog');
      const dialogContent = document.getElementById('dialog-content');
      const disclosures = [];

      function el(tag,className,text) {
        const node=document.createElement(tag);
        if(className) node.className=className;
        if(text!==undefined) node.textContent=text;
        return node;
      }
      function link(url,title,className) {
        const anchor=el('a',className,title);
        const parsed=new URL(url);
        if(['https:','http:','file:'].includes(parsed.protocol)) anchor.href=url;
        anchor.target='_blank';anchor.rel='noopener noreferrer';return anchor;
      }
      function showEvidence(ids,title='原文') {
        document.getElementById('dialog-title').textContent=title;dialogContent.replaceChildren();
        [...new Set(ids)].forEach(id=>{
          const source=sources.get(id);const entry=el('section','evidence');
          entry.append(el('h3','',source.title),el('p','location',source.location),el('blockquote','',source.excerpt));
          if(source.url) entry.append(link(source.url,'打开原始资料 ↗','original'));
          dialogContent.append(entry);
        });
        dialog.showModal();
      }
      function sourceButton(ids,context,label) {
        if(!ids||!ids.length) return null;
        const button=el('button','source-button',label||`[${[...new Set(ids)].map(id=>sourceNumbers.get(id)).join(',')}]`);
        button.type='button';button.setAttribute('aria-label',`查看原文：${context}`);
        button.addEventListener('click',()=>showEvidence(ids));return button;
      }
      function content(record,tag,className,withSource=false,withStatus=true) {
        const node=el(tag,className);
        if(withStatus&&labels[record.kind]) node.append(el('span',`status ${record.kind}`,labels[record.kind]));
        const evidence=withSource&&sourceButton(record.source_ids,record.text);
        if(evidence){const letters=Array.from(record.text);const tail=el('span','text-tail',letters.slice(-3).join(''));tail.append(evidence);node.append(document.createTextNode(letters.slice(0,-3).join('')),tail);}
        else node.append(document.createTextNode(record.text));
        return node;
      }
      function sourceIds(section) {
        return [...new Set([...(section.summary.source_ids||[]),...(section.note?.source_ids||[]),...(section.highlights||[]).flatMap(item=>item.source_ids||[]),...(section.details||[]).flatMap(branch=>branch.items.flatMap(item=>item.source_ids||[])),...(section.references||[]).flatMap(reference=>reference.source_ids||[])])];
      }
      document.getElementById('report-title').textContent=data.title;
      for(const key of ['subtitle','context']){if(data[key]){document.getElementById(key).hidden=false;document.getElementById(key).textContent=data[key];}}
      document.getElementById('demo-label').hidden=!data.demo;
      if(sources.size){const entry=document.getElementById('open-sources');entry.hidden=false;entry.addEventListener('click',()=>showEvidence(data.sources.map(source=>source.id),'原 brief'));}
      definitions.forEach(([key,title],index)=>{
        const section=data.sections[key];const row=el('section','row');row.id=key;row.setAttribute('aria-labelledby',`heading-${key}`);
        const label=el('div','label');const number=el('span','number',String(index+1).padStart(2,'0'));number.setAttribute('aria-hidden','true');
        const labelText=el('div','label-text');const heading=el('h2','',title);heading.id=`heading-${key}`;labelText.append(heading);
        if(labels[section.summary.kind]) labelText.append(el('span',`section-tag ${section.summary.kind}`,labels[section.summary.kind]));
        label.append(number,labelText);row.append(label);
        const answer=el('div','answer');answer.append(content(section.summary,'p','summary',false,false));
        if(section.note) answer.append(content(section.note,'p','note',false,section.note.kind!==section.summary.kind));
        if(section.highlights?.length){const list=el('ul','highlights');section.highlights.forEach(record=>{
          const item=el('li',record.label==='时间'?'schedule':'');if(record.label) item.append(el('span','highlight-label',record.label));
          const text=content(record,'span','highlight-text');
          if(record.text.includes('→')){text.replaceChildren();if(labels[record.kind]) text.append(el('span',`status ${record.kind}`,labels[record.kind]));record.text.split(/\s*→\s*/u).forEach((step,index)=>{if(index) text.append(document.createTextNode(' → '));text.append(el('span','flow-step',step));});}
          else if(record.label==='时间'){text.replaceChildren();if(labels[record.kind]) text.append(el('span',`status ${record.kind}`,labels[record.kind]));record.text.split(/(（[^）]{1,24}）)/u).forEach(part=>{if(part.startsWith('（')&&part.endsWith('）')) text.append(el('span','no-break',part));else text.append(document.createTextNode(part));});}
          item.append(text);list.append(item);
        });answer.append(list);}
        if(section.references?.length){const references=el('div','references');section.references.forEach(reference=>{const entry=el('div','reference');entry.append(link(reference.url,`${reference.title} ↗`,''));if(statuses[reference.status]) entry.append(el('span','ref-status',statuses[reference.status]));references.append(entry);});answer.append(references);}
        const ids=sourceIds(section);const referenceNotes=(section.references||[]).filter(reference=>reference.status==='viewed'&&reference.note);
        if(section.details?.length||ids.length||referenceNotes.length){
          const details=el('details','disclosure');details.id=`details-${key}`;
          const toggle=el('summary','disclosure-toggle');toggle.setAttribute('aria-label',`展开：${title}`);toggle.title='展开';
          const icon=el('span','expand-icon');icon.setAttribute('aria-hidden','true');toggle.append(icon);
          const body=el('div','detail-body');
          (section.details||[]).forEach(branch=>{const group=el('section','branch');const list=el('ul','');branch.items.forEach(item=>{const stated=(item.kind==='unknown'&&/确认|待定/u.test(branch.title))||(item.kind==='conflict'&&/冲突/u.test(branch.title));list.append(content(item,'li','',true,item.kind!==section.summary.kind&&!stated));});group.append(el('h3','',branch.title),list);body.append(group);});
          if(referenceNotes.length){const group=el('section','branch');group.append(el('h3','','参考怎么用？'));const list=el('ul','');referenceNotes.forEach(reference=>list.append(content({text:`${reference.title}：${reference.note}`,kind:'suggestion',source_ids:reference.source_ids},'li','',true)));group.append(list);body.append(group);}
          if(ids.length){const evidence=el('p','section-evidence');evidence.append(sourceButton(ids,title,'本节原文'));body.append(evidence);}
          details.append(toggle,body);details.addEventListener('toggle',()=>{const action=details.open?'收起':'展开';toggle.setAttribute('aria-label',`${action}：${title}`);toggle.title=action;});disclosures.push(details);answer.append(details);
        }
        row.append(answer);document.getElementById('overview').append(row);
      });
      if(new URLSearchParams(location.search).get('state')==='expanded') disclosures.forEach(details=>{details.open=true;});
      document.getElementById('close-dialog').addEventListener('click',()=>dialog.close());
      dialog.addEventListener('click',event=>{const rect=dialog.getBoundingClientRect();if(event.target===dialog&&(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)) dialog.close();});
      window.addEventListener('beforeprint',()=>disclosures.forEach(details=>{details.dataset.wasOpen=String(details.open);details.open=true;}));
      window.addEventListener('afterprint',()=>disclosures.forEach(details=>{details.open=details.dataset.wasOpen==='true';}));
    })();
  </script>
</body>
</html>
