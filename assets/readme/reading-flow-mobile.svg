<svg xmlns="http://www.w3.org/2000/svg" width="600" height="920" viewBox="0 0 600 920" role="img" aria-labelledby="title desc">
  <title id="title">概览、展开与原文</title>
  <desc id="desc">虚构内容节选示意：先看四问概览，点击加号查看一个选题的场景、材料和推进方式，品牌要求可点原文核对。</desc>
  <rect width="600" height="920" fill="#fff"/>
  <g font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
    <text x="24" y="40" fill="#717176" font-size="24">先看四问概览</text>
    <g fill="#202022" font-size="28">
      <text x="24" y="102">产品到底做什么？</text>
      <text x="24" y="172">这次要推什么？</text>
      <text x="24" y="242">哪些要求不能漏？</text>
      <text x="24" y="312">这条视频可以怎么拍？</text>
    </g>
    <g stroke="#dedee0">
      <path d="M24 126H576 M24 196H576 M24 266H576 M24 336H576"/>
    </g>
    <g fill="#656569" font-size="30"><text x="540" y="103">＋</text><text x="540" y="173">＋</text><text x="540" y="243">＋</text></g>
    <circle cx="555" cy="302" r="24" fill="#202022"/>
    <path d="M545 302h20m-10-10v20" stroke="#fff" stroke-width="2"/>
    <path d="M555 350v30m-8-9 8 9 8-9" fill="none" stroke="#929297" stroke-width="2"/>
    <text x="24" y="409" fill="#717176" font-size="24">点击 ＋，看具体选题</text>
    <text x="24" y="470" fill="#202022" font-size="30" font-weight="600">旧教程，回答粉丝的新问题</text>
    <g fill="#656569" font-size="24"><text x="24" y="526">场景</text><text x="24" y="616">材料</text><text x="24" y="706">怎么拍</text></g>
    <g fill="#202022" font-size="27">
      <text x="24" y="568">粉丝总问：逆光人像怎么拍？</text>
      <text x="24" y="658">一条旧摄影教程 ＋ 那条评论</text>
      <text x="24" y="748">找到完整答案，校对后导出短片。</text>
      <text x="24" y="788">从问题讲到选段依据和结果。</text>
    </g>
    <path d="M24 824H576" stroke="#dedee0"/>
    <text x="24" y="866" fill="#656569" font-size="25">品牌要求 → 点［原文］核对出处</text>
    <text x="24" y="906" fill="#85858a" font-size="19">交互示意 · 虚构内容节选</text>
  </g>
</svg>
